<title>Request Pipeline Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* Linear tokens - the target project's own stylesheet already uses these
     exact values, so the replica and the instrument share one system. */
  :root {
    --canvas:#010102; --surface-1:#0f1011; --surface-2:#141516; --surface-3:#18191a;
    --ink:#f7f8f8; --ink-muted:#d0d6e0; --ink-subtle:#8a8f98; --ink-tertiary:#62666d;
    --primary:#5e6ad2; --primary-hover:#828fff; --primary-focus:#5e69d1; --on-primary:#fff;
    --success:#27a644;
    --hairline:#23252a; --hairline-strong:#34343a; --hairline-tertiary:#3e3e44;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
    --ease:cubic-bezier(0.16,1,0.3,1); --dur:400ms;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{height:100vh;overflow:hidden;background:var(--canvas);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.05px;
    -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .eyebrow{color:var(--ink-subtle);font-size:12px;font-weight:500;letter-spacing:.4px;text-transform:uppercase}

  .lab{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(240px,.62fr) minmax(0,.95fr);height:100vh}
  .pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--hairline)}
  .pane:last-child{border-right:0}
  .pane-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    height:46px;padding:0 16px;border-bottom:1px solid var(--hairline);background:var(--canvas)}
  .pane-head h2{font-size:13px;font-weight:500;letter-spacing:-.1px}
  .pane-head .sub{color:var(--ink-tertiary);font-size:10.5px;font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pane-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}

  .logo-symbol{display:grid;place-items:center;width:22px;height:22px;color:var(--on-primary);
    background:var(--primary);border-radius:6px;font-size:11px;font-weight:600;flex:none}

  /* ---- tabs ---- */
  .tabs{flex:none;display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--hairline);background:var(--surface-1)}
  .tab{padding:5px 11px;border:1px solid transparent;border-radius:7px;background:none;
    color:var(--ink-subtle);font-size:12px;cursor:pointer;transition:all 160ms ease}
  .tab:hover{color:var(--ink);background:var(--surface-2)}
  .tab.on{color:var(--ink);background:var(--surface-3);border-color:var(--hairline-strong)}

  /* ---- replica app ---- */
  .app-nav{display:flex;align-items:center;gap:8px;padding:10px 18px 0;font-size:12px;color:var(--ink-subtle)}
  .app-nav button{background:none;border:0;color:var(--ink-subtle);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:12px}
  .app-nav button:hover{color:var(--ink);background:var(--surface-2)}
  .app-nav button.on{color:var(--ink);background:var(--surface-2)}

  .page{padding:14px 18px 32px}
  .menu-grid{display:grid;gap:10px}
  .menu-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface-1);
    border:1px solid var(--hairline);border-radius:12px;cursor:pointer;transition:all 160ms ease}
  .menu-item:hover{border-color:var(--hairline-tertiary);background:var(--surface-2)}
  .menu-thumb{width:46px;height:46px;flex:none;border-radius:8px;background:var(--surface-3);
    display:grid;place-items:center;color:var(--ink-tertiary);font-size:15px;
    background-image:linear-gradient(var(--hairline) 1px,transparent 1px),linear-gradient(90deg,var(--hairline) 1px,transparent 1px);
    background-size:14px 14px}
  .menu-item .nm{font-size:14px;font-weight:500}
  .menu-item .pr{color:var(--ink-subtle);font-size:12px;font-family:var(--mono)}
  .menu-item .go{margin-left:auto;color:var(--ink-tertiary);font-size:12px}

  .detail-card{background:var(--surface-1);border:1px solid var(--hairline);border-radius:14px;overflow:hidden}
  .detail-media{height:96px;margin:9px;border-radius:9px;background:var(--surface-2);
    border:1px solid var(--hairline);display:grid;place-content:center;text-align:center;
    background-image:linear-gradient(var(--hairline) 1px,transparent 1px),linear-gradient(90deg,var(--hairline) 1px,transparent 1px);
    background-size:24px 24px}
  .detail-media span{font-size:19px;font-weight:600;color:var(--ink-muted)}
  .detail-media small{color:var(--ink-subtle);font-size:10px}
  .detail-content{padding:14px 18px 18px}
  .detail-heading{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--hairline)}
  .detail-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:6px}
  .detail-title-row h1{font-size:25px;line-height:1.12;letter-spacing:-.7px;font-weight:600}
  .detail-price{flex:none;text-align:right;font-family:var(--mono);font-size:18px}
  .detail-price .label{display:block;color:var(--ink-subtle);font-family:var(--sans);font-size:10px;margin-bottom:2px}
  #total-price{transition:color var(--dur) var(--ease)}
  #total-price.bump{color:var(--primary-hover)}
  .detail-intro{margin-top:9px;color:var(--ink-subtle);font-size:12px}

  .customize-form{display:flex;flex-direction:column;gap:11px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .table-number{color:var(--ink-muted);font-size:13px}
  .field{display:grid;gap:5px}
  .field label{color:var(--ink-muted);font-size:12px;font-weight:500}
  .optional{margin-left:3px;color:var(--ink-tertiary);font-size:10px;font-weight:400}
  .field input,.field select,.field textarea{width:100%;min-height:36px;padding:7px 10px;
    background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:7px;
    outline:none;font-size:13px;transition:border-color 160ms ease,box-shadow 160ms ease}
  .field textarea{min-height:54px;resize:vertical;font-family:var(--sans)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-focus);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--primary-focus) 20%,transparent)}
  .field textarea::placeholder{color:var(--ink-tertiary)}
  .ingredient-fieldset{display:grid;grid-template-columns:1fr 1fr;gap:7px;border:0}
  .ingredient-fieldset legend{grid-column:1/-1;margin-bottom:1px;color:var(--ink-muted);font-size:12px;font-weight:500}
  .check-field{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--surface-2);
    border:1px solid var(--hairline);border-radius:7px;cursor:pointer;transition:all 160ms ease}
  .check-field input{position:absolute;width:1px;height:1px;opacity:0}
  .check-control{position:relative;display:block;flex:none;width:16px;height:16px;background:var(--surface-1);
    border:1px solid var(--hairline-strong);border-radius:4px;transition:all 160ms ease}
  .check-field input:checked+.check-control{background:var(--primary);border-color:var(--primary)}
  .check-field input:checked+.check-control::after{position:absolute;top:2px;left:5px;width:3px;height:7px;
    content:"";border:solid var(--on-primary);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check-copy{display:flex;flex:1;align-items:center;justify-content:space-between;gap:10px;min-width:0}
  .check-copy strong{font-size:12.5px;font-weight:500}
  .check-copy small{color:var(--ink-subtle);font-size:11px}
  .ingredient-fieldset .check-field:has(input:checked){background:color-mix(in srgb,var(--primary) 14%,var(--surface-2));border-color:var(--primary)}
  .ingredient-fieldset .check-copy{flex-direction:column;align-items:flex-start;gap:0}
  .add-to-cart{display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;
    min-height:40px;margin-top:2px;color:var(--on-primary);background:var(--primary);
    border:1px solid var(--primary);border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;
    transition:all 160ms ease}
  .add-to-cart:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
  .add-to-cart:disabled{opacity:.65;cursor:wait}
  .form-feedback{min-height:16px;color:var(--ink-subtle);font-size:11px;text-align:center}
  .form-feedback.is-success{color:var(--success)}
  .form-feedback.is-error{color:var(--primary-hover)}

  /* cart page */
  .cart-box{background:var(--surface-1);border:1px solid var(--hairline);border-radius:12px;padding:12px;margin-bottom:10px}
  .cart-box h3{font-size:13px;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between}
  .cart-box h3 span{color:var(--ink-subtle);font-family:var(--mono);font-size:11px}
  .cart-item-box{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--hairline)}
  .cart-item-box .nm{font-size:12.5px;flex:1;min-width:0}
  .cart-item-box .nm small{display:block;color:var(--ink-tertiary);font-size:10.5px}
  .cart-item-box select{min-height:32px;padding:4px 8px;background:var(--surface-2);
    border:1px solid var(--hairline-strong);border-radius:6px;font-size:12px;outline:none}
  .cart-item-box select.is-saved{border-color:var(--success)}

  /* API console */
  .console-list{padding:10px 14px 30px;display:grid;gap:6px}
  .cgroup{margin-top:10px;margin-bottom:2px;color:var(--ink-tertiary);font-size:10px;
    letter-spacing:.5px;text-transform:uppercase}
  .crow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;background:var(--surface-1);
    border:1px solid var(--hairline);border-radius:8px;cursor:pointer;text-align:left;transition:all 160ms ease}
  .crow:hover{background:var(--surface-2);border-color:var(--hairline-tertiary)}
  .crow.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface-1))}
  .verb{flex:none;width:52px;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:9.5px;
    text-align:center;border:1px solid var(--hairline-strong);color:var(--ink-subtle)}
  .verb.GET{color:#7ea8f0;border-color:#2f4468}
  .verb.POST{color:#7fc99a;border-color:#2c4a38}
  .verb.PATCH,.verb.PUT{color:#d9b070;border-color:#4d3f26}
  .verb.DELETE{color:#e08585;border-color:#5a2f2f}
  .crow .cpath{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .cmeta{flex:none;color:var(--ink-tertiary);font-size:10px}
  .crow .cui{flex:none;color:var(--primary-hover);font-size:9.5px;border:1px solid var(--primary-focus);
    border-radius:3px;padding:0 4px}

  /* ---- pipeline rail ---- */
  .pipe-status{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:38px;
    border-bottom:1px solid var(--hairline);background:var(--surface-1);font-size:11px;color:var(--ink-subtle)}
  .pipe-status .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--hairline-tertiary);
    transition:background var(--dur) var(--ease)}
  .pipe-status.live .dot{background:var(--primary)}
  .pipe-status.client .dot{background:var(--ink-subtle)}
  .stages{padding:12px 12px 20px;position:relative}
  .boundary{display:flex;align-items:center;gap:8px;margin:8px 0 8px 22px;color:var(--ink-tertiary);
    font-size:9px;letter-spacing:.5px;text-transform:uppercase}
  .boundary::before{content:"";width:10px;height:1px;background:var(--hairline-strong);flex:none}
  .boundary::after{content:"";flex:1;height:1px;background:var(--hairline-strong)}
  .stage{position:relative;margin-left:22px;border-left:1px solid var(--hairline);padding-left:14px;padding-bottom:2px;
    transition:border-left-color var(--dur) var(--ease)}
  .stage.done{border-left-color:var(--primary-focus)}
  .stage:last-of-type{border-left-color:transparent}
  #packet{position:absolute;left:18px;width:8px;height:8px;border-radius:50%;background:var(--primary-hover);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 26%,transparent);opacity:0;pointer-events:none;z-index:3;
    transition:top 460ms var(--ease),opacity 220ms ease}
  #packet.on{opacity:1}
  .stage-node{position:absolute;left:-7px;top:10px;width:13px;height:13px;border-radius:50%;
    background:var(--surface-2);border:1px solid var(--hairline-strong);display:grid;place-items:center;
    font-family:var(--mono);font-size:7px;color:var(--ink-tertiary);
    transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .stage.done .stage-node{border-color:var(--primary-focus)}
  .stage.active .stage-node{background:var(--primary);border-color:var(--primary);color:var(--on-primary);transform:scale(1.35)}
  .stage-head{display:block;width:100%;padding:6px 9px;background:transparent;border:1px solid transparent;
    border-radius:7px;cursor:pointer;text-align:left;transition:all 160ms ease}
  .stage-head:hover{background:var(--surface-2)}
  .stage.active>.stage-head{background:color-mix(in srgb,var(--primary) 12%,var(--surface-1));border-color:var(--primary-focus)}
  .stage.dimmed>.stage-head{opacity:.3}
  .stage-name{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
  .type-chip{padding:1px 5px;border-radius:3px;background:var(--surface-3);border:1px solid var(--hairline-strong);
    font-family:var(--mono);font-size:9px;color:var(--ink-subtle);white-space:nowrap;margin-left:auto;
    transition:all var(--dur) var(--ease)}
  .stage.active .type-chip{background:color-mix(in srgb,var(--primary) 22%,var(--surface-3));
    border-color:var(--primary);color:var(--ink)}

  /* ---- scrubber ---- */
  .scrub{flex:none;padding:9px 14px 11px;border-top:1px solid var(--hairline);background:var(--surface-1)}
  .scrub-row{display:flex;align-items:center;gap:7px}
  .ctrl{display:grid;place-items:center;width:26px;height:26px;flex:none;background:var(--surface-2);
    border:1px solid var(--hairline-strong);border-radius:6px;cursor:pointer;font-size:10px;color:var(--ink-muted);
    transition:all 160ms ease}
  .ctrl:hover:not(:disabled){background:var(--surface-3);color:var(--ink)}
  .ctrl:disabled{opacity:.35;cursor:default}
  .ctrl.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .track{flex:1;display:flex;align-items:center;gap:2px;min-width:0}
  .tick{flex:1;height:3px;border-radius:2px;background:var(--hairline);border:0;padding:0;cursor:pointer;
    transition:background var(--dur) var(--ease),transform 160ms ease}
  .tick:hover{transform:scaleY(2.2)}
  .tick.done{background:var(--primary-focus)}
  .tick.active{background:var(--primary-hover);transform:scaleY(2.4)}
  .scrub-label{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:10px;color:var(--ink-tertiary)}
  .scrub-label .now{color:var(--ink-muted);font-family:var(--mono)}

  /* ---- data pane (always on) ---- */
  .data-wrap{padding:14px 16px 30px}
  .data-title{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .data-title h3{font-size:15px;font-weight:600;letter-spacing:-.2px}
  .side-badge{padding:1px 6px;border-radius:4px;font-size:9px;letter-spacing:.4px;text-transform:uppercase;
    border:1px solid var(--hairline-strong);color:var(--ink-tertiary)}
  .side-badge.client{color:#7ea8f0;border-color:#2f4468}
  .side-badge.server{color:#7fc99a;border-color:#2c4a38}
  .side-badge.wire{color:#d9b070;border-color:#4d3f26}
  .data-sub{color:var(--ink-tertiary);font-size:11.5px;margin-bottom:13px}

  .sect{margin-bottom:13px}
  .sect-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px;
    color:var(--ink-tertiary);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase}
  .sect-label .src{font-family:var(--mono);text-transform:none;letter-spacing:0}
  .box{background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;padding:9px 11px;
    font-family:var(--mono);font-size:11px;line-height:1.7;overflow-x:auto}
  .box.raw{white-space:pre-wrap;word-break:break-all;color:var(--ink-muted)}
  .box.code{white-space:pre;color:var(--ink-subtle);font-size:10.5px;line-height:1.6;max-height:330px;overflow:auto}
  .kv{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .kv .k{color:var(--ink-subtle)}
  .kv .v{color:var(--ink);word-break:break-all}
  .kv .t{padding:0 4px;border-radius:3px;border:1px solid var(--hairline-tertiary);color:var(--ink-tertiary);font-size:9.5px}
  .kv.hot{background:color-mix(in srgb,var(--primary) 11%,transparent);border-radius:4px}
  .kv.hot .t{border-color:var(--primary);color:var(--primary-hover)}
  .kv-nest{padding-left:12px;border-left:1px solid var(--hairline);margin-left:2px;width:100%}
  .teach{padding:8px 10px;background:color-mix(in srgb,var(--primary) 9%,var(--surface-1));
    border:1px solid color-mix(in srgb,var(--primary) 32%,transparent);border-radius:8px;
    color:var(--ink-muted);font-size:11.5px;line-height:1.55}
  .teach b{color:var(--ink);font-weight:600}
  .teach code{font-family:var(--mono);font-size:10.5px;color:var(--primary-hover)}
  .src-toggle{width:100%;padding:6px 9px;background:var(--surface-1);border:1px solid var(--hairline);
    border-radius:7px;color:var(--ink-subtle);font-size:11px;cursor:pointer;text-align:left;
    display:flex;justify-content:space-between;gap:8px;transition:all 160ms ease}
  .src-toggle:hover{background:var(--surface-2);color:var(--ink)}
  .src-toggle .f{font-family:var(--mono);font-size:10px;color:var(--ink-tertiary)}

  .empty{padding:34px 22px;color:var(--ink-tertiary);font-size:12.5px;line-height:1.65;text-align:center}
  .empty strong{display:block;color:var(--ink-muted);font-size:13.5px;margin-bottom:5px;font-weight:500}
  .kbd{display:inline-block;margin:0 2px;padding:1px 5px;background:var(--surface-2);
    border:1px solid var(--hairline-strong);border-radius:4px;font-family:var(--mono);font-size:10.5px;color:var(--ink-subtle)}
  .seed-note{margin-top:12px;padding:9px 11px;color:var(--ink-tertiary);font-size:10.5px;line-height:1.5;
    background:var(--surface-1);border:1px solid var(--hairline);border-radius:8px}
  .seed-note code{font-family:var(--mono);color:var(--ink-subtle)}

  @media (max-width:1100px){
    body{overflow:auto;height:auto}
    .lab{grid-template-columns:1fr;height:auto}
    .pane{border-right:0;border-bottom:1px solid var(--hairline)}
    .pane-body{overflow:visible}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important}}
</style>

<div class="lab">
  <!-- ================= 1. the app ================= -->
  <section class="pane">
    <div class="pane-head">
      <div style="display:flex;align-items:center;gap:9px"><span class="logo-symbol">赤</span><h2>Chi Lu Hotpot</h2></div>
      <span class="sub" id="url-bar">/</span>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="app">App</button>
      <button class="tab" data-tab="console">API Console</button>
    </div>
    <div class="pane-body">
      <div id="tab-app">
        <div class="app-nav" id="app-nav"></div>
        <div class="page" id="app-page"></div>
      </div>
      <div id="tab-console" hidden>
        <div class="console-list" id="console-list"></div>
      </div>
    </div>
  </section>

  <!-- ================= 2. the pipeline ================= -->
  <section class="pane">
    <div class="pane-head">
      <h2>Pipeline</h2>
      <span class="sub" id="ep-label">idle</span>
    </div>
    <div class="pipe-status" id="pipe-status">
      <span class="dot"></span><span id="pipe-status-text">Waiting for an interaction.</span>
    </div>
    <div class="pane-body">
      <div class="stages" id="stages"></div>
    </div>
    <div class="scrub" id="scrub" hidden>
      <div class="scrub-row">
        <button class="ctrl" id="btn-prev">◀</button>
        <button class="ctrl primary" id="btn-play">▶</button>
        <button class="ctrl" id="btn-next">▶</button>
        <div class="track" id="track"></div>
      </div>
      <div class="scrub-label"><span class="now" id="scrub-now"></span><span id="scrub-phase"></span></div>
    </div>
  </section>

  <!-- ================= 3. the data ================= -->
  <section class="pane">
    <div class="pane-head">
      <h2>Data structure</h2>
      <span class="sub" id="data-key"></span>
    </div>
    <div class="pane-body">
      <div class="data-wrap" id="data-wrap">
        <div class="empty">
          <strong>Nothing has happened yet.</strong>
          Browse the app on the left, or fire any endpoint from the <span class="kbd">API Console</span>.
          Whatever you do, the data at every stage appears here.
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const DATA = __ENDPOINTS_JSON__;
const EP = Object.fromEntries(DATA.endpoints.map(e => [e.id, e]));
const SQL = DATA.sql_pool;
const NOTE_PH = DATA.note_placeholder;

/* ---------- tiny helpers ---------- */
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function unwrap(n) {
  if (n && typeof n === "object" && "type" in n && "value" in n) {
    if (n.type === "list") return n.value.map(unwrap);
    if (n.type === "dict") { const o = {}; for (const k in n.value) o[k] = unwrap(n.value[k]); return o; }
    return n.value;
  }
  return n;
}
function subNote(node, note) {
  if (node === null || typeof node !== "object") return node === NOTE_PH ? note : node;
  if (Array.isArray(node)) return node.map(v => subNote(v, note));
  const o = {};
  for (const k in node) o[k] = (node[k] === NOTE_PH) ? note : subNote(node[k], note);
  return o;
}
function jsT(v) {
  if (Array.isArray(v)) return { type: "Array", value: v.map(jsT) };
  if (v === null) return { type: "null", value: null };
  if (v && typeof v === "object") { const o = {}; for (const k in v) o[k] = jsT(v[k]); return { type: "Object", value: o }; }
  return { type: typeof v, value: v };
}
function pyT(v) {
  if (Array.isArray(v)) return { type: "list", value: v.map(pyT) };
  if (typeof v === "boolean") return { type: "bool", value: v ? "True" : "False" };
  if (typeof v === "number") return { type: Number.isInteger(v) ? "int" : "float", value: v };
  if (v === null) return { type: "NoneType", value: "None" };
  if (v && typeof v === "object") { const o = {}; for (const k in v) o[k] = pyT(v[k]); return { type: "dict", value: o }; }
  return { type: "str", value: v };
}

/* ---------- state ---------- */
let S = { ep: null, run: null, live: null, cursor: -1, timer: null, srcOpen: false };

/* ================================================================
   The replica app
   ================================================================ */
const PRODUCTS = DATA.products, MEATS = DATA.meats, TOPPINGS = DATA.toppings;
const STATUSES = DATA.statuses;
let currentPage = "menu", currentSlug = PRODUCTS[0].slug;

function renderNav() {
  const nav = $("app-nav");
  nav.innerHTML = "";
  [["menu", "菜單"], ["cart", "訂單管理"]].forEach(([id, label]) => {
    const b = el("button", currentPage === id || (id === "menu" && currentPage === "detail") ? "on" : "", label);
    b.onclick = () => goto(id);
    nav.appendChild(b);
  });
}

function goto(page, slug) {
  currentPage = page;
  if (slug) currentSlug = slug;
  renderNav();
  if (page === "menu") { $("url-bar").textContent = "/"; renderMenu(); fire("get_index", "default", { url: "/", method: "GET", how: "Clicked 菜單" }); }
  else if (page === "detail") {
    const p = PRODUCTS.find(x => x.slug === currentSlug);
    $("url-bar").textContent = "/menuitem/" + p.name + "/";
    renderDetail();
    fire("get_menuitem_page", currentSlug, { url: "/menuitem/" + currentSlug + "/", method: "GET", how: "Opened " + p.name });
  }
  else { $("url-bar").textContent = "/cart_list/"; renderCart(); fire("get_cart_list_manager", "manager", { url: "/cart_list/", method: "GET", how: "Clicked 訂單管理" }); }
}

function renderMenu() {
  const page = $("app-page");
  page.innerHTML = "";
  const grid = el("div", "menu-grid");
  PRODUCTS.forEach(p => {
    const row = el("div", "menu-item");
    row.innerHTML = `<div class="menu-thumb">赤</div>
      <div><div class="nm">${esc(p.name)}</div><div class="pr">$${p.price}</div></div>
      <div class="go">查看 →</div>`;
    row.onclick = () => goto("detail", p.slug);
    grid.appendChild(row);
  });
  page.appendChild(grid);
  const n = el("p", "seed-note");
  n.innerHTML = `Every navigation here fires a real Django HTML view &mdash; watch the pipeline lose its
    <code>Serializer</code> stage and gain a <code>Template</code> stage.`;
  page.appendChild(n);
}

function renderDetail() {
  const p = PRODUCTS.find(x => x.slug === currentSlug);
  const page = $("app-page");
  page.innerHTML = `
    <article class="detail-card">
      <div class="detail-media"><span>赤炉</span><small>Chi Lu Hotpot</small></div>
      <div class="detail-content">
        <header class="detail-heading">
          <p class="eyebrow">客製您的鍋物</p>
          <div class="detail-title-row">
            <h1>${esc(p.name)}</h1>
            <p class="detail-price"><span class="label">總金額 :</span><span id="total-price">0</span></p>
          </div>
          <p class="detail-intro">選擇肉品、份量與桌號，我們將為您現點現做。</p>
        </header>
        <form id="customize-form" class="customize-form" data-slug="${p.slug}" data-price="${p.price}">
          <div class="form-grid">
            <p class="table-number">桌號：7</p>
            <div class="field"><label for="quantity">數量</label>
              <input type="number" id="quantity" name="quantity" min="1" max="5" value="1" required></div>
          </div>
          <div class="field"><label for="meattype">肉類選擇</label><select id="meattype" name="meattype" required></select></div>
          <fieldset class="ingredient-fieldset" id="toppings"><legend>配料選擇 <span class="optional">選填</span></legend></fieldset>
          <label class="check-field" for="doublemeat">
            <span><input type="checkbox" id="doublemeat" data-doublemeat-addon-price="80"><span class="check-control"></span></span>
            <span class="check-copy"><strong>雙倍肉量</strong><small>再加一份肉 +$80</small></span></label>
          <div class="field"><label for="notes">備註 <span class="optional">選填</span></label>
            <textarea id="notes" maxlength="200" rows="3" placeholder="例如：少辣、不要蔥"></textarea></div>
          <button type="submit" class="add-to-cart">加入訂單 <span>→</span></button>
          <p id="form-feedback" class="form-feedback"></p>
        </form>
      </div>
    </article>`;

  const sel = $("meattype");
  sel.innerHTML = '<option value="" disabled selected>請選擇肉類</option>';
  MEATS.forEach(m => {
    const o = el("option"); o.value = m.slug; o.dataset.addonPrice = m.addon_price;
    o.textContent = `${m.name} (+$${Number(m.addon_price).toFixed(0)})`;
    sel.appendChild(o);
  });
  const tb = $("toppings");
  TOPPINGS.forEach(t => {
    const lab = el("label", "check-field");
    lab.htmlFor = "ingredient-" + t.slug;
    lab.innerHTML = `<span><input type="checkbox" id="ingredient-${t.slug}" name="hotpotingredients"
      value="${t.slug}" data-addon-price="${t.addon_price}"><span class="check-control"></span></span>
      <span class="check-copy"><strong>${esc(t.name)}</strong><small>+$${Number(t.addon_price).toFixed(2)}</small></span>`;
    tb.appendChild(lab);
  });
  wireForm();
  updateTotal();
}

/* ---- the project's real pricing logic, from menudetail.js ---- */
function totalPrice() {
  const form = $("customize-form");
  const basePrice = Number(form.dataset.price);
  const quantity = Number($("quantity").value);
  const SelectMeat = $("meattype").selectedOptions[0];
  const meattypeAddonPrice = SelectMeat ? Number(SelectMeat.dataset.addonPrice) || 0 : 0;
  const dbl = $("doublemeat");
  const doublemeatAddonPrice = dbl.checked ? Number(dbl.dataset.doublemeatAddonPrice) : 0;
  let ing = 0;
  form.querySelectorAll('input[name="hotpotingredients"]:checked').forEach(i => ing += Number(i.dataset.addonPrice));
  return (basePrice + meattypeAddonPrice + doublemeatAddonPrice + ing) * quantity;
}
function updateTotal() {
  const t = $("total-price"); if (!t) return;
  t.textContent = totalPrice();
  t.classList.add("bump"); setTimeout(() => t.classList.remove("bump"), 400);
}
function getSelectedIngredients() {
  return Array.from($("customize-form").querySelectorAll('input[name="hotpotingredients"]:checked'), i => i.value);
}

function readDom() {
  return {
    'getElementById("quantity").value': { type: "string", value: $("quantity").value },
    'getElementById("meattype").value': { type: "string", value: $("meattype").value },
    'getElementById("doublemeat").checked': { type: "boolean", value: $("doublemeat").checked },
    'getElementById("notes").value': { type: "string", value: $("notes").value },
    'querySelectorAll(":checked")': { type: "NodeList", value: getSelectedIngredients().join(", ") || "(empty)" },
    "form.dataset.slug": { type: "string", value: $("customize-form").dataset.slug },
  };
}

function wireForm() {
  const form = $("customize-form");
  form.addEventListener("input", updateTotal);
  form.addEventListener("change", updateTotal);
  form.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "doublemeat") clientOnly("雙倍肉量 " + (t.checked ? "added" : "removed"));
    else if (t.name === "hotpotingredients")
      clientOnly((TOPPINGS.find(x => x.slug === t.value) || {}).name + " " + (t.checked ? "added" : "removed"));
    else if (t.id === "meattype") clientOnly("肉類 selected");
    else if (t.id === "quantity") clientOnly("數量 changed to " + t.value);
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    const fb = $("form-feedback");
    const payload = {
      product: form.dataset.slug,
      meattype: $("meattype").value,
      doublemeat: $("doublemeat").checked,
      notes: $("notes").value,
      quantity: Number($("quantity").value),
      hotpotingredients: getSelectedIngredients(),
    };
    const key = [payload.product, payload.meattype,
                 [...payload.hotpotingredients].sort().join(",") || "-",
                 payload.doublemeat ? "1" : "0", String(payload.quantity)].join("|");
    if (!EP.post_cart_item.runs[key]) {
      fb.textContent = "請先選擇肉類。"; fb.className = "form-feedback is-error";
      return;
    }
    const rawBody = JSON.stringify(payload);
    fire("post_cart_item", key, {
      how: "Pressed 加入訂單", url: "/api/cart/item/", method: "POST",
      dom: readDom(), payload, rawBody,
      headers: { "Content-Type": "application/json", "X-CSRFToken": "prototype-token", credentials: "same-origin" },
    });
    fb.textContent = "已加入訂單，我們會立即為您準備。"; fb.className = "form-feedback is-success";
    btn.textContent = "已加入 ✓";
    setTimeout(() => { btn.innerHTML = '加入訂單 <span>→</span>'; }, 2600);
  });
}

function renderCart() {
  const page = $("app-page");
  page.innerHTML = "";
  const box = el("div", "cart-box");
  box.innerHTML = `<h3>桌號 7 · customer <span>總金額 $460.00</span></h3>`;
  [[PRODUCTS[0], MEATS[0]], [PRODUCTS[1], MEATS[1]]].forEach(([p, m], i) => {
    const row = el("div", "cart-item-box");
    const sel = el("select");
    STATUSES.forEach(s => { const o = el("option"); o.value = s.value; o.textContent = s.label; sel.appendChild(o); });
    sel.onchange = () => {
      sel.classList.add("is-saved"); setTimeout(() => sel.classList.remove("is-saved"), 1200);
      fire("patch_cart_item", sel.value, {
        how: "Changed status to " + sel.value, url: "/api/cart/item/<id>/", method: "PATCH",
        dom: { "select.value": { type: "string", value: sel.value },
               "select.dataset.itemId": { type: "string", value: String(i + 1) } },
        payload: { status: sel.value },
        rawBody: JSON.stringify({ status: sel.value }),
        headers: { "Content-Type": "application/json", "X-CSRFToken": "prototype-token", credentials: "same-origin" },
      });
    };
    row.innerHTML = `<div class="nm">${esc(p.name)}<small>${esc(m.name)} · ×1 · $${p.price}</small></div>`;
    row.appendChild(sel);
    box.appendChild(row);
  });
  page.appendChild(box);
  const n = el("p", "seed-note");
  n.innerHTML = `Changing a status runs the project's <code>cart-list.js</code> path:
    <code>PATCH /api/cart/item/&lt;id&gt;/</code>. These two lines are the ones the recorder actually seeded.`;
  page.appendChild(n);
}

/* ---------- API console ---------- */
function renderConsole() {
  const list = $("console-list");
  list.innerHTML = "";
  const groups = [
    ["Triggered by the app's own UI", DATA.endpoints.filter(e => e.trigger)],
    ["No UI trigger — fire them here", DATA.endpoints.filter(e => !e.trigger)],
  ];
  groups.forEach(([label, eps]) => {
    if (!eps.length) return;
    list.appendChild(el("div", "cgroup", label));
    eps.forEach(e => {
      const b = el("button", "crow");
      b.dataset.ep = e.id;
      b.innerHTML = `<span class="verb ${e.method}">${e.method}</span>
        <span class="cpath">${esc(e.path)}</span>
        ${e.trigger ? '<span class="cui">in app</span>' : ""}
        <span class="cmeta">${esc(e.view)}</span>`;
      b.onclick = () => {
        const key = Object.keys(e.runs)[0];
        fire(e.id, key, { how: "Fired from the API Console", url: e.path, method: e.method });
      };
      list.appendChild(b);
    });
  });
}

$("app-page") && renderNav();
renderMenu();
renderConsole();
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
    $("tab-app").hidden = t.dataset.tab !== "app";
    $("tab-console").hidden = t.dataset.tab !== "console";
  };
});

/* ================================================================
   Stage rail
   ================================================================ */
const BOUNDARY = { url_router: "leaves your browser", javascript_then: "back in your browser",
                   render: "back in your browser", console_out: "back in your browser" };
const stagesEl = $("stages");
let stageEls = {}, packetEl = null;

function buildRail(ep) {
  stagesEl.innerHTML = "";
  stageEls = {};
  ep.stages.forEach((s, i) => {
    if (BOUNDARY[s.id]) stagesEl.appendChild(el("div", "boundary", BOUNDARY[s.id]));
    const w = el("div", "stage"); w.dataset.id = s.id;
    const node = el("div", "stage-node", String(i + 1)); w.appendChild(node);
    const head = el("button", "stage-head");
    head.type = "button";
    head.innerHTML = `<span class="stage-name">${esc(s.name)}<span class="type-chip">—</span></span>`;
    head.onclick = () => { pause(); setCursor(i); };
    w.appendChild(head);
    stagesEl.appendChild(w);
    stageEls[s.id] = w;
  });
  packetEl = el("div"); packetEl.id = "packet"; stagesEl.appendChild(packetEl);

  const track = $("track");
  track.innerHTML = "";
  ep.stages.forEach((s, i) => {
    const b = el("button", "tick"); b.title = s.name;
    b.onclick = () => { pause(); setCursor(i); };
    track.appendChild(b);
  });
}

function movePacket(id) {
  if (!id || !packetEl) { packetEl && packetEl.classList.remove("on"); return; }
  const w = stageEls[id]; const n = w.querySelector(".stage-node");
  packetEl.style.top = (w.offsetTop + n.offsetTop + n.offsetHeight / 2 - 4) + "px";
  packetEl.classList.add("on");
}

/* ================================================================
   What each stage holds
   ================================================================ */
function chip(id, ep, run) {
  const hasBody = !!(run && run.request_body);
  const rb = run && run.response_body;
  const hasOut = !!(rb && rb.value && Object.keys(rb.value).length);
  const m = {
    dom: "strings", navigation: "URL", console: "request spec",
    javascript: "JS object", network: hasBody ? "JSON string" : "headers only",
    http_request: "text + headers",
    url_router: "view class", middleware: "request object", view: "python dict",
    serializer_in: "model objects", database: "SQL rows",
    serializer_out: hasOut ? "python dict" : "no body",
    template: "context dict",
    http_response: hasOut ? "text" : (run ? String(run.status_code) : "text"),
    javascript_then: hasOut ? "JS object" : "status only",
    dom_update: "rendered", render: "new DOM",
    console_out: hasOut ? "parsed body" : "status only",
  };
  return m[id] || "—";
}

function sqlText(refs) { return (refs || []).map(i => SQL[i]).join("\n\n"); }

function payloadFor(stage, ep, run, live) {
  const id = stage.id;
  const note = live && live.payload ? live.payload.notes : undefined;
  const S_in = run.serializer_in ? subNote(run.serializer_in, note) : null;
  const S_out = run.response_body ? subNote(run.response_body, note) : null;
  const reqBody = run.request_body ? subNote(run.request_body, note) : null;
  const out = { rows: null, raw: null, rawLabel: null, note: null, srcKey: null, hot: [] };

  switch (id) {
    case "navigation":
      out.rows = { "URL": { type: "string", value: (live && live.url) || ep.path },
                   "method": { type: "string", value: ep.method },
                   "triggered by": { type: "string", value: (live && live.how) || "navigation" } };
      out.note = `A page navigation carries <b>no JSON body</b>. Everything the server needs is in the URL, the cookies and the session.`;
      break;
    case "console":
      out.rows = { "method": { type: "string", value: ep.method },
                   "path": { type: "string", value: ep.path },
                   "body": reqBody || { type: "NoneType", value: "None" } };
      out.note = `This endpoint has <b>no UI in the app</b> — nothing in the project's JavaScript calls it. It exists because DRF's generic views create it.`;
      break;
    case "dom":
      out.rows = live && live.dom ? live.dom : { "(recorded)": { type: "str", value: "no live DOM for this endpoint" } };
      out.note = `Every <code>.value</code> is a <b>string</b> — even <code>&lt;input type="number"&gt;</code>. Only <code>.checked</code> is a real boolean.`;
      out.srcKey = "dom";
      break;
    case "javascript":
      out.rows = {}; out.hot = ["quantity"];
      const p = (live && live.payload) || unwrap(reqBody) || {};
      for (const k in p) out.rows[k] = jsT(p[k]);
      out.note = live && live.dom
        ? `<code>Number(...)</code> turned a string into a number. The relations are still just <b>slug strings</b> — nothing knows what a row is yet.`
        : `The object a client would send.`;
      out.srcKey = "javascript";
      break;
    case "network": {
      const raw = (live && live.rawBody) || (reqBody ? JSON.stringify(unwrap(reqBody)) : null);
      out.rows = {};
      const h = raw
        ? ((live && live.headers) || { "Content-Type": "application/json" })
        : { "Cookie": "sessionid=…; csrftoken=…", "Accept": "text/html" };
      for (const k in h) out.rows[k] = { type: "string", value: String(h[k]) };
      if (raw) {
        out.raw = raw; out.rawLabel = "JSON.stringify(payload)";
        out.note = `The whole object collapsed into <b>one string</b>, ${raw.length} characters long. Numbers and booleans lost their quotes, but it is all text now.`;
      } else {
        out.rows["body"] = { type: "NoneType", value: "no body" };
        out.note = `A <code>${ep.method}</code> carries <b>no body</b> — nothing is serialized here. The only thing travelling is the URL and the headers, and the <b>cookie</b> is what will make the server think it knows who you are.`;
      }
      out.srcKey = "network";
      break;
    }
    case "http_request": {
      const raw = (live && live.rawBody) || (reqBody ? JSON.stringify(unwrap(reqBody)) : "");
      out.raw = `${ep.method} ${(live && live.url) || ep.path} HTTP/1.1\nHost: 127.0.0.1:8000\n` +
        (raw ? `Content-Type: application/json\nContent-Length: ${raw.length}\n` : "") +
        `Cookie: sessionid=…; csrftoken=…\n\n` + raw;
      out.rawLabel = "bytes on the wire";
      out.note = `Nothing structured survives the trip. The server receives <b>text and headers</b> and rebuilds meaning from it.`;
      break;
    }
    case "url_router":
      out.rows = run.route ? {
        "path": { type: "str", value: run.route.path },
        "matched pattern": { type: "str", value: run.route.matched_pattern },
        "url_name": { type: "str", value: run.route.url_name },
        "view": { type: "class", value: run.route.view_class || run.route.callable },
        "kwargs": run.route.kwargs,
      } : null;
      out.hot = ["view"];
      out.note = `The URL <b>string</b> became a <b>Python callable</b>. The router does not touch your data.`;
      break;
    case "middleware":
      out.rows = run.middleware;
      out.hot = ["request.user", "request.session['table_number']"];
      out.note = `<code>request.user</code> and <code>request.session</code> did not come from the request body — <b>middleware attached them</b> by reading the session cookie.`;
      break;
    case "view": {
      out.rows = {
        "view class": { type: "class", value: ep.view },
        "permission_classes": { type: "list", value: (ep.permissions || []).map(p => ({ type: "class", value: p })) },
        "serializer_class": { type: ep.serializer ? "class" : "NoneType", value: ep.serializer || "None (no serializer)" },
        "model": { type: ep.model ? "class" : "NoneType", value: ep.model || "None" },
      };
      if (reqBody) out.rows["request.data"] = pyT(unwrap(reqBody));
      out.note = ep.serializer
        ? `The JSON text is now a <b>Python dict</b>. JavaScript's <code>true</code> became Python's <code>True</code>. The slugs are <b>still strings</b>.`
        : `<b>No serializer here.</b> This is a plain Django view — it queries the ORM and hands the result to a template.`;
      out.srcKey = "view";
      break;
    }
    case "serializer_in":
      out.rows = S_in ? S_in.value : (reqBody ? pyT(unwrap(reqBody)).value : null);
      out.hot = ["product", "meattype", "hotpotingredients"];
      out.note = S_in
        ? `<b>This is the transformation you could not see.</b> <code>SlugRelatedField</code> ran a <code>SELECT</code> for each slug and replaced the string with the actual <b>Django model object</b> — one you can call <code>.addon_price</code> on.`
        : `Incoming fields after validation.`;
      out.srcKey = "serializer_in";
      break;
    case "database": {
      out.rows = run.row ? run.row.value : { "queries run": { type: "int", value: run.query_count } };
      out.raw = sqlText([...(run.sql_reads || []).slice(0, 3), ...(run.sql_writes || [])]);
      out.rawLabel = `SQL actually emitted (${run.query_count} queries)`;
      out.hot = ["price", "status", "id"];
      out.note = run.sql_writes && run.sql_writes.length
        ? `Model objects became <b>column values</b>. Any field you never sent — like <code>status</code> — appeared from its <b>model default</b>.`
        : `A read-only request: ${run.query_count} queries, no writes.`;
      out.srcKey = "database";
      break;
    }
    case "serializer_out":
      if (S_out && S_out.value && Object.keys(S_out.value).length) {
        out.rows = S_out.value;
        out.hot = ["price", "product", "meattype", "cart"];
        out.note = `The trip reverses: model objects collapse back to <b>slug strings</b>, and any <code>Decimal</code> becomes a <b>string</b>, not a number. That is DRF's <code>DecimalField</code> default.`;
      } else {
        out.rows = { "serialized body": { type: "NoneType", value: "None" },
                     "status": { type: "int", value: run.status_code } };
        out.note = `<b>Nothing is serialized on the way out.</b> A <code>${run.status_code}</code> carries no body — the serializer was only used to find and validate the object, not to describe it back.`;
      }
      out.srcKey = "serializer_out";
      break;
    case "template":
      out.rows = run.template_context || { "(no context)": { type: "NoneType", value: "None" } };
      out.raw = (run.templates || []).join("\n");
      out.rawLabel = "templates rendered";
      out.note = `<b>No JSON anywhere.</b> The queryset went straight into a template context and came out as ${run.content_length} bytes of HTML.`;
      break;
    case "http_response": {
      const body = S_out ? JSON.stringify(unwrap(S_out)) : `(${run.content_length} bytes)`;
      out.raw = `HTTP/1.1 ${run.status_code}\n` +
        (S_out ? "Content-Type: application/json\n" : "Content-Type: text/html\n") +
        `Content-Length: ${run.content_length}\n\n` + body;
      out.rawLabel = "bytes on the wire";
      out.note = `Status <b>${run.status_code}</b>. Text again — the browser must parse it before it means anything.`;
      break;
    }
    case "javascript_then":
    case "console_out": {
      const parsed = S_out ? jsT(unwrap(S_out)).value : null;
      if (parsed && Object.keys(parsed).length) {
        out.rows = parsed;
        out.hot = ["price"];
        out.note = parsed.price
          ? `Back to a JavaScript object. Watch <code>price</code> — still a <b>string</b>. <code>price + 10</code> would concatenate, not add.`
          : `<code>res.json()</code> turned the response text back into a JavaScript object.`;
      } else {
        out.rows = { "res.status": { type: "number", value: run.status_code },
                     "res.ok": { type: "boolean", value: run.status_code < 400 },
                     "body": { type: "null", value: null } };
        out.note = `There is <b>nothing to parse</b>. Calling <code>res.json()</code> on a <code>${run.status_code}</code> would actually <b>throw</b> — the only information here is the status code.`;
      }
      out.srcKey = "javascript";
      break;
    }
    case "render":
      out.rows = { "templates": { type: "list", value: (run.templates || []).map(t => ({ type: "str", value: t })) },
                   "bytes": { type: "int", value: run.content_length },
                   "status": { type: "int", value: run.status_code } };
      out.note = `The browser parses that HTML into a <b>fresh DOM</b> — and any <code>&lt;script&gt;</code> on the page starts the cycle over.`;
      break;
    case "dom_update":
      out.rows = { "#form-feedback.textContent": { type: "string", value: "已加入訂單，我們會立即為您準備。" },
                   "button.textContent": { type: "string", value: "已加入 ✓" } };
      out.note = run.computed
        ? `Round trip closed. The 總金額 on the left was computed by <b>your JavaScript</b>; <code>${run.computed.unit_price}</code> was computed <b>independently by Django</b>. Two implementations of one formula.`
        : `Round trip closed.`;
      out.srcKey = "dom";
      break;
  }
  return out;
}

/* ---------- data pane rendering ---------- */
function kvRow(k, node, hot) {
  const row = el("div", "kv" + (hot ? " hot" : ""));
  row.appendChild(el("span", "k", k + ":"));
  if (node && (node.type === "dict" || node.type === "Object")) {
    const n = el("div", "kv-nest");
    for (const kk in node.value) n.appendChild(kvRow(kk, node.value[kk], false));
    row.appendChild(n); return row;
  }
  if (node && (node.type === "list" || node.type === "Array")) {
    const n = el("div", "kv-nest");
    if (!node.value.length) n.appendChild(el("span", "v", "[]  (empty)"));
    node.value.forEach((v, i) => n.appendChild(kvRow("[" + i + "]", v, false)));
    row.appendChild(n); return row;
  }
  row.appendChild(el("span", "t", node ? node.type : "?"));
  let shown;
  if (node === null || node === undefined) shown = "—";
  else if (node.type === "NoneType" || node.value === null) shown = "None";
  else if (typeof node.value === "string") shown = JSON.stringify(node.value);
  else shown = String(node.value);
  row.appendChild(el("span", "v", shown));
  return row;
}

function renderData() {
  const wrap = $("data-wrap");
  wrap.innerHTML = "";
  const ep = S.ep, run = S.run;
  if (!ep || S.cursor < 0) return;
  const stage = ep.stages[S.cursor];
  const p = payloadFor(stage, ep, run, S.live);

  const title = el("div", "data-title");
  title.appendChild(el("h3", null, stage.name));
  title.appendChild(el("span", "side-badge " + stage.side, stage.side));
  wrap.appendChild(title);
  wrap.appendChild(el("div", "data-sub", stage.sub));

  if (p.rows) {
    const s = el("div", "sect");
    const lab = el("div", "sect-label");
    lab.appendChild(el("span", null, "Shape at this point"));
    wrap.appendChild(s);
    s.appendChild(lab);
    const box = el("div", "box");
    for (const k in p.rows) box.appendChild(kvRow(k, p.rows[k], p.hot.includes(k)));
    s.appendChild(box);
  }
  if (p.raw) {
    const s = el("div", "sect");
    const lab = el("div", "sect-label");
    lab.appendChild(el("span", null, p.rawLabel || "raw"));
    s.appendChild(lab);
    s.appendChild(el("div", "box raw", p.raw));
    wrap.appendChild(s);
  }
  if (p.note) {
    const t = el("div", "teach"); t.innerHTML = p.note;
    const s = el("div", "sect"); s.appendChild(t); wrap.appendChild(s);
  }
  const code = ep.code && (ep.code[p.srcKey] || ep.code[stage.id]);
  if (code) {
    const s = el("div", "sect");
    const btn = el("button", "src-toggle");
    btn.innerHTML = `<span>${S.srcOpen ? "▾" : "▸"} Real source</span><span class="f">${esc(code.file)}:${code.start_line}</span>`;
    btn.onclick = () => { S.srcOpen = !S.srcOpen; renderData(); };
    s.appendChild(btn);
    if (S.srcOpen) s.appendChild(el("div", "box code", code.code));
    wrap.appendChild(s);
  }
}

/* ================================================================
   Timeline
   ================================================================ */
function setCursor(i) {
  S.cursor = i;
  const ep = S.ep; if (!ep) return;
  ep.stages.forEach((s, idx) => {
    const w = stageEls[s.id];
    w.classList.toggle("active", idx === i);
    w.classList.toggle("done", idx < i);
    w.classList.remove("dimmed");
    w.querySelector(".type-chip").textContent = idx <= i ? chip(s.id, ep, S.run) : "—";
    const tk = $("track").children[idx];
    tk.classList.toggle("active", idx === i);
    tk.classList.toggle("done", idx < i);
  });
  const s = ep.stages[i];
  movePacket(s ? s.id : null);
  if (s) {
    $("scrub-now").textContent = `${i + 1}/${ep.stages.length}  ${s.name}`;
    $("scrub-phase").textContent = s.side;
    $("pipe-status").className = "pipe-status live";
    $("pipe-status-text").innerHTML = `<strong>${esc(s.name)}</strong>`;
    stageEls[s.id].scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  $("btn-prev").disabled = i <= 0;
  $("btn-next").disabled = i >= ep.stages.length - 1;
  renderData();
}
function play() {
  const n = S.ep.stages.length;
  if (S.cursor >= n - 1) S.cursor = -1;
  $("btn-play").textContent = "❚❚";
  S.timer = setInterval(() => {
    if (S.cursor >= n - 1) { pause(); return; }
    setCursor(S.cursor + 1);
  }, 500);
  setCursor(S.cursor + 1);
}
function pause() { if (S.timer) clearInterval(S.timer); S.timer = null; $("btn-play").textContent = "▶"; }
$("btn-play").onclick = () => (S.timer ? pause() : play());
$("btn-prev").onclick = () => { pause(); if (S.cursor > 0) setCursor(S.cursor - 1); };
$("btn-next").onclick = () => { pause(); if (S.cursor < S.ep.stages.length - 1) setCursor(S.cursor + 1); };

function fire(epId, runKey, live) {
  const ep = EP[epId]; if (!ep) return;
  const run = ep.runs[runKey] || ep.runs[Object.keys(ep.runs)[0]];
  pause();
  S = { ep, run, live: live || null, cursor: -1, timer: null, srcOpen: S.srcOpen };
  buildRail(ep);
  $("scrub").hidden = false;
  $("ep-label").textContent = `${ep.method} ${ep.path}`;
  $("data-key").textContent = runKey === "default" ? "" : runKey;
  document.querySelectorAll(".crow").forEach(r => r.classList.toggle("on", r.dataset.ep === epId));
  play();
}

/* ---- client-only interactions ---- */
let pulseT = null;
function clientOnly(what) {
  if (S.timer) return;
  clearTimeout(pulseT);
  const ep = EP.post_cart_item;
  if (!S.ep || S.ep.id !== ep.id) { buildRail(ep); S.ep = ep; S.run = ep.runs[Object.keys(ep.runs)[0]]; $("scrub").hidden = false; }
  ep.stages.forEach((s, i) => {
    const w = stageEls[s.id];
    const local = i <= 1;
    w.classList.toggle("active", local);
    w.classList.toggle("dimmed", !local);
    w.classList.remove("done");
    w.querySelector(".type-chip").textContent = local ? (i === 0 ? "strings" : "recalculated") : "—";
  });
  movePacket("javascript");
  $("pipe-status").className = "pipe-status client";
  $("pipe-status-text").innerHTML = `<strong>${esc(what)}</strong> — never left the browser`;
  $("scrub-now").textContent = "client-only";
  $("scrub-phase").textContent = "no request";

  const wrap = $("data-wrap");
  wrap.innerHTML = "";
  const title = el("div", "data-title");
  title.appendChild(el("h3", null, "Client-only change"));
  title.appendChild(el("span", "side-badge client", "client"));
  wrap.appendChild(title);
  wrap.appendChild(el("div", "data-sub", what));
  const s = el("div", "sect");
  s.appendChild(el("div", "sect-label")).appendChild(el("span", null, "State that changed"));
  const box = el("div", "box");
  const dom = readDom();
  for (const k in dom) box.appendChild(kvRow(k, dom[k], false));
  box.appendChild(kvRow("totalPrice()", { type: "number", value: totalPrice() }, true));
  s.appendChild(box);
  wrap.appendChild(s);
  const t = el("div", "teach");
  t.innerHTML = `<b>No request was sent.</b> Django never learned about this. The number on the left was
    recomputed by <code>totalPrice()</code> in the browser — which is why the server recomputes the price
    <i>again</i>, from scratch, when you finally submit.`;
  const s2 = el("div", "sect"); s2.appendChild(t); wrap.appendChild(s2);

  pulseT = setTimeout(() => {
    if (S.timer) return;
    ep.stages.forEach(s => stageEls[s.id] && stageEls[s.id].classList.remove("active", "dimmed"));
    movePacket(null);
    $("pipe-status").className = "pipe-status";
    $("pipe-status-text").textContent = "Idle.";
  }, 3200);
}

/* ---- go ---- */
goto("menu");
</script>
