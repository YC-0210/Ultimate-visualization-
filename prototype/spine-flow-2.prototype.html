<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — the spine as triggers moving data</title>
<!--
  THROWAWAY PROTOTYPE. The design is settled; this is the reference for
  folding it into MAP.html properly. Delete after that lands.

  How it got here:
    round 1 (spine-flow.prototype.html, variants A/B/C) → the grid won.
    round 2 (variants D/E/F)                           → D won.
    E and F are dropped rather than left to rot; they are in git history
    at commit a630a2c if the reasoning is ever needed again.

  What D is:
    · The grid — every value's whole life on screen at once. Rows are
      values, columns are events, and the slider only dims what has not
      happened yet.
    · A zone band over the columns — Browser / the wire / Django / Database
      — so the round trip's shape is readable without reading a value. The
      segment holding the current event is lit; that band is the ONLY place
      the current zone is shown, because a second zone strip above the page
      said the same thing twice and implied a fixed left-to-right ordering
      the journey does not actually follow.
    · An event is a TRIGGER: a person doing something, or a function
      returning a value. Never a keystroke.
    · The person stays visible — the scenario line, and green dots on the
      columns where a human, not code, caused the event.

  Honesty rule (D2): the browser half is not captured by the real Trace yet
  (Phase 4). Those events are marked "not captured". Everything else is
  from the real POST /api/cart/item/ trace at P1.9.
-->
<style>
  :root {
    --bg:#f4f1ea; --paper:#fbf9f4; --ink:#1c1917; --muted:#57534e;
    --rule:#d6d3cd; --accent:#9f1239; --accent-soft:#fff1f2;
    --ok:#166534; --ok-bg:#dcfce7;
    --hop:#b45309; --hop-bg:#fef3c7;
    --z-browser:#0369a1; --z-browser-bg:#e0f2fe;
    --z-wire:#57534e;    --z-wire-bg:#eae7df;
    --z-django:#9f1239;  --z-django-bg:#fff1f2;
    --z-db:#6d28d9;      --z-db-bg:#ede9fe;
    --user:#047857; --user-bg:#d1fae5;
    --mono:"Iowan Old Style",Palatino,Georgia,serif;
    --sans:"Avenir Next","Segoe UI",Helvetica,sans-serif;
    --code:"IBM Plex Mono","Source Code Pro",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-bottom:2.5rem}
  .wrap{max-width:1280px;margin:0 auto;padding:1.5rem 1.3rem 0}
  .head{border-bottom:1px solid var(--rule);padding-bottom:.8rem;margin-bottom:.9rem}
  .kicker{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 .3rem}
  h1{font-family:var(--mono);font-size:1.45rem;font-weight:600;margin:0 0 .25rem}
  .sub{color:var(--muted);font-size:.8rem;margin:0}

  /* the scenario — who is doing what, always on screen */
  .scenario{
    display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
    background:var(--user-bg);border:1px solid #a7f3d0;border-radius:4px;
    padding:.5rem .75rem;margin:.9rem 0;font-size:.78rem;
  }
  .scenario .tag{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--user);font-weight:700}
  .scenario code{font-family:var(--code);font-size:.74rem;background:#fff;padding:.06rem .3rem;border-radius:2px}

  .scrub{display:flex;align-items:center;gap:.7rem;margin:.8rem 0 .5rem}
  .scrub button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:.2rem .55rem;cursor:pointer;font-size:.8rem;color:var(--ink)}
  .scrub button:disabled{opacity:.3;cursor:default}
  .scrub input[type=range]{flex:1;accent-color:var(--accent)}
  .readout{font-size:.66rem;color:var(--muted);white-space:nowrap;min-width:9rem;text-align:right}

  /* the trigger line — what just happened, and who caused it */
  .trigger{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.75rem;font-size:.85rem;min-height:1.6rem}
  .by{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;padding:.12rem .4rem;border-radius:2px;font-weight:700;white-space:nowrap}
  .by.user{background:var(--user-bg);color:var(--user)}
  .by.code{background:#eae7df;color:var(--muted)}
  .trigger .what{font-weight:600}
  .trigger .fn{font-family:var(--code);font-size:.76rem;color:var(--accent)}
  .trigger .ret{font-family:var(--code);font-size:.72rem;color:var(--muted)}

  .ty{font-family:var(--code);font-size:.62rem;padding:.04rem .3rem;border-radius:2px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .ty.was{background:transparent;color:var(--muted);border:1px solid var(--rule)}
  .lit{font-family:var(--code);font-size:.72rem}
  .arr{color:var(--muted)}
  .stage{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:1rem}
  .note{font-size:.76rem;color:var(--muted);margin-top:.8rem;line-height:1.6;min-height:3rem}
  .badge{font-size:.55rem;letter-spacing:.09em;text-transform:uppercase;padding:.1rem .35rem;border-radius:2px}
  .badge.fut{background:transparent;color:var(--muted);border:1px dashed var(--rule)}
  .badge.hop{background:var(--hop-bg);color:var(--hop)}

  /* ---------- the grid ---------- */
  .grid{overflow:auto;max-height:62vh}
  .grid table{border-collapse:separate;border-spacing:0;font-size:.66rem}
  .grid th,.grid td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:.16rem .28rem;text-align:center;white-space:nowrap}
  .grid th.name{text-align:left;font-family:var(--code);font-size:.64rem;position:sticky;left:0;background:var(--paper);z-index:3;min-width:7.5rem;border-left:1px solid var(--rule)}
  .grid thead th{position:sticky;background:var(--paper);z-index:5;font-weight:500;font-size:.54rem;color:var(--muted);border-top:1px solid var(--rule)}
  .grid thead th.name{z-index:6}
  .grid thead tr.zonerow th{top:0;font-size:.54rem;letter-spacing:.08em;text-transform:uppercase}
  .grid thead tr.numrow th{top:1.4rem}

  /* the zone band. Muted by default; the segment holding the current event
     is the one that carries full colour — this is where "which zone am I in"
     is answered, and the only place it is answered. */
  .zb{background:#f0ede6!important;color:#a8a29e!important;border-bottom:2px solid transparent!important}
  .zb.on[data-z=browser]{background:var(--z-browser-bg)!important;color:var(--z-browser)!important;border-bottom-color:var(--z-browser)!important}
  .zb.on[data-z=wire]{background:var(--z-wire-bg)!important;color:var(--z-wire)!important;border-bottom-color:var(--z-wire)!important}
  .zb.on[data-z=django]{background:var(--z-django-bg)!important;color:var(--z-django)!important;border-bottom-color:var(--z-django)!important}
  .zb.on[data-z=db]{background:var(--z-db-bg)!important;color:var(--z-db)!important;border-bottom-color:var(--z-db)!important}
  .zb.on{font-weight:700}

  .grid td.zt-browser{background:rgba(224,242,254,.35)}
  .grid td.zt-wire{background:rgba(234,231,223,.4)}
  .grid td.zt-django{background:rgba(255,241,242,.45)}
  .grid td.zt-db{background:rgba(237,233,254,.4)}
  .grid td.after{opacity:.18}
  .grid td.void{background:repeating-linear-gradient(45deg,transparent,transparent 3px,#e8e5de 3px,#e8e5de 4px)}
  .grid td.hold{color:#b9b4ab}
  .grid td.change{background:var(--hop-bg)!important;color:var(--hop);font-weight:700}
  .grid td.born{background:var(--ok-bg)!important;color:var(--ok);font-weight:700}
  .grid td.nowcol,.grid th.nowcol{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
  .cv{font-family:var(--code);font-size:.62rem}
  .userflag{color:var(--user);font-weight:700}

  .values{margin-top:.9rem;border:1px solid var(--rule);border-radius:4px;padding:.6rem .7rem;background:var(--bg)}
  .values .row{padding:.12rem 0}
  .values .row.now{background:var(--hop-bg);margin:0 -.4rem;padding:.12rem .4rem;border-radius:2px}
  .values .k{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <p class="kicker">Throwaway prototype · settled design</p>
    <h1>The spine, as triggers moving data</h1>
    <p class="sub">The slider or <strong>← →</strong> steps one event at a time.</p>
  </div>

  <div class="scenario">
    <span class="tag">You are doing this</span>
    <span>On <code>/menuitem/經典原味鍋/</code> — you set the quantity to 2, pick 牛肉, and press <strong>加入訂單</strong> (add to order).</span>
  </div>

  <div class="scrub">
    <button id="prev" type="button">◀</button>
    <input id="slider" type="range" min="0" step="1" aria-label="Step events">
    <button id="next" type="button">▶</button>
    <span class="readout" id="readout"></span>
  </div>

  <div class="trigger" id="trigger"></div>
  <div id="stage" class="stage"></div>
  <p class="note" id="note"></p>
</div>

<script>
/* ============================================================
   THE EVENT STREAM

   An event is something that MOVES THE DATA FORWARD:
     · a person doing something  (by: "user")
     · a function returning      (by: "code", with fn + ret)

   zone : browser | wire | django | db   — where the work happens
   obs  : does the real Trace see this? false = Phase 4, not captured
   sets : the values this event changes  → the grid
   note : plain language, one idea
   ============================================================ */
const ZONES = [
  { id:"browser", name:"Browser"  },
  { id:"wire",    name:"The wire" },
  { id:"django",  name:"Django"   },
  { id:"db",      name:"Database" },
];

const EVENTS = [
  { by:"user", zone:"browser", obs:false,
    what:"You open the dish page", ret:"the page renders",
    sets:{ page:{t:"url", v:"/menuitem/經典原味鍋/"} },
    note:"An ordinary page load. Nothing about the order exists yet — the form is empty and the server has been told nothing." },

  { by:"user", zone:"browser", obs:false,
    what:"You set the quantity to 2", ret:"the input holds \"2\"",
    sets:{ quantity:{t:"str", v:'"2"'} },
    note:"The DOM has no numbers. Whatever you type into a form control is a string until some JavaScript changes that." },

  { by:"user", zone:"browser", obs:false,
    what:"You pick 牛肉 from the meat list", ret:"the select holds \"牛肉\"",
    sets:{ meattype:{t:"str", v:'"牛肉"'} },
    note:"Also a string, and note what it is: a name a human reads, not a database id." },

  { by:"user", zone:"browser", obs:false,
    what:"You press 加入訂單", ret:"the click handler runs",
    note:"This is the moment the whole journey starts. Everything after this is code reacting to one press." },

  { by:"code", zone:"browser", obs:false, hop:true,
    fn:"buildPayload()", ret:"→ an object",
    what:"the handler assembles what to send",
    sets:{ quantity:{t:"int", v:"2", was:"str"} },
    note:"Number(\"2\") runs here. First type change of the journey — and Django will never know it happened, because it only ever receives the 2." },

  { by:"code", zone:"browser", obs:false, hop:true,
    fn:"JSON.stringify(payload)", ret:"→ a string",
    what:"the object is flattened to text",
    sets:{ body:{t:"str", v:'{"product":"經典原味鍋","quantity":2,…}', was:"object"} },
    note:"Three typed fields collapse into one string, because the network moves bytes and nothing else." },

  { by:"code", zone:"wire", obs:false,
    fn:"fetch('/api/cart/item/', …)", ret:"→ a Promise",
    what:"the request leaves the browser",
    sets:{ request:{t:"POST", v:"/api/cart/item/ · 412 bytes"} },
    note:"The network boundary. Everything before this line is invisible to Django, which is exactly why the browser has to report its own half separately." },

  { by:"code", zone:"django", obs:true, hop:true,
    fn:"request.body.decode('utf-8')", ret:"→ a str",
    what:"middleware reads the incoming body",
    sets:{ body:{t:"str", v:'{"product":"經典原味鍋","quantity":2,…}', was:"bytes"} },
    note:"receive_input. The bytes that came off the wire become text. This is the first line of your own middleware, and the first place it can crash on a real request." },

  { by:"code", zone:"django", obs:true,
    fn:"resolver.resolve(path)", ret:"→ a ResolverMatch",
    what:"Django decides which view handles this",
    sets:{ route:{t:"str", v:"api/cart/item/"}, view:{t:"str", v:"cartitemList"} },
    note:"route. Until this returns, the URL is just a string — nothing has decided what it means. This is why resolver_match does not exist on the way in." },

  { by:"code", zone:"django", obs:true,
    fn:"SessionMiddleware", ret:"→ sets request.session",
    what:"the sessionid cookie is looked up",
    sets:{ session:{t:"dict", v:'{"table_number": 4}'} },
    note:"attach_context. The cookie carried only a number. The dictionary it points at has been sitting on the server the whole time." },

  { by:"code", zone:"django", obs:true,
    fn:"AuthenticationMiddleware", ret:"→ sets request.user",
    what:"the session is turned into a user",
    sets:{ user:{t:"AnonymousUser", v:"is_authenticated=False"} },
    note:"Nobody logged in, so this is AnonymousUser — an object, not None. The order is tied to the table, not to a person." },

  { by:"code", zone:"django", obs:true,
    fn:"cartitemList.post(request)", ret:"→ (running)",
    what:"your view is finally called",
    note:"Everything so far was Django getting the request ready. Your own code starts here." },

  { by:"code", zone:"db", obs:true,
    fn:"SELECT … WHERE product='經典原味鍋'", ret:"→ 1 row",
    what:"the database is asked who that name is",
    sets:{ row:{t:"row", v:"id=1, price=250.00"} },
    note:"You never wrote this query. The serializer field wrote it, because you told it to look products up by name." },

  { by:"code", zone:"django", obs:true, hop:true,
    fn:"SlugRelatedField.to_internal_value()", ret:"→ a menuitem instance",
    what:"the name becomes a real database object",
    sets:{ product:{t:"menuitem instance", v:"pk=1", was:"str"} },
    note:"The single most valuable moment the tool shows. The string you picked in a dropdown is now a row object with methods and a price, and nothing in your source code says this happened." },

  { by:"code", zone:"django", obs:true,
    fn:"serializer.is_valid()", ret:"→ True",
    what:"the input is accepted",
    sets:{ validated:{t:"dict", v:"3 typed fields"} },
    note:"validate_input. Untrusted text in, typed objects out. If this had returned False, nothing below would have happened at all." },

  { by:"code", zone:"django", obs:true, hop:true,
    fn:"cartitemSerializer.create()", ret:"→ a cartitem",
    what:"your code computes the price",
    sets:{ price:{t:"Decimal", v:'Decimal("250.00")', was:"—"} },
    note:"price was never sent by the browser. It is born here, from the product row, which is why editing a cart item later leaves it stale — the bug the prototype found." },

  { by:"code", zone:"db", obs:true,
    fn:"INSERT INTO cartitem", ret:"→ pk=7",
    what:"the order line is saved",
    sets:{ cart_id:{t:"int", v:"7"} },
    note:"The first moment anything about your order survives. Until now it only existed in memory." },

  { by:"code", zone:"django", obs:true, hop:true,
    fn:"serializer.data", ret:"→ a dict",
    what:"the objects are turned back into plain values",
    sets:{ price:{t:"str", v:'"250.00"', was:"Decimal"} },
    note:"Second type change on the same value. A Decimal computed in Python leaves as a string, because JSON has no decimal type." },

  { by:"code", zone:"wire", obs:true,
    fn:"HttpResponse", ret:"→ 201 Created",
    what:"the response goes back out",
    sets:{ status:{t:"int", v:"201"}, response:{t:"str", v:'{"id":7,"price":"250.00",…}'} },
    note:"send_response. The last moment Django sees. Whatever the browser does next happens without it." },

  { by:"code", zone:"browser", obs:false, hop:true,
    fn:"res.json()", ret:"→ an object",
    what:"the browser parses the reply",
    sets:{ response:{t:"object", v:'{id:7, price:"250.00", …}', was:"str"} },
    note:"After the response was sent, so no server probe can ever witness this. It is one of the three reasons the browser probe exists." },

  { by:"code", zone:"browser", obs:false,
    fn:"renderCart()", ret:"→ updates the DOM",
    what:"the cart total is written to the page",
    sets:{ total:{t:"str", v:'"NT$ 500"'} },
    note:"price is still a string here. It was a string in the browser, a Decimal in Python, and a string again on the way back — and it never once became a number in the browser." },

  { by:"user", zone:"browser", obs:false,
    what:"You see the total change", ret:"NT$ 500",
    note:"One press, twenty-one steps, two database queries and four type changes later. That is the journey this tool exists to make visible." },
];

const ALL_KEYS = (() => { const s=[]; EVENTS.forEach(e=>e.sets&&Object.keys(e.sets).forEach(k=>s.includes(k)||s.push(k))); return s; })();
const zoneName = id => ZONES.find(z=>z.id===id).name;
function stateAt(i){ const s={}; for(let n=0;n<=i;n++){const e=EVENTS[n]; if(e.sets) for(const[k,v]of Object.entries(e.sets)) s[k]={...v,at:n};} return s; }

/* Contiguous runs of the same zone — the band's segments. */
function zoneRuns() {
  const runs = [];
  EVENTS.forEach((e, n) => {
    const last = runs[runs.length - 1];
    if (last && last.zone === e.zone) { last.span++; last.end = n; }
    else runs.push({ zone: e.zone, span: 1, start: n, end: n });
  });
  return runs;
}

function render(i) {
  let h = '<div class="grid"><table><thead><tr class="zonerow"><th class="name">zone</th>';
  zoneRuns().forEach(r => {
    const on = i >= r.start && i <= r.end;
    h += `<th class="zb${on?' on':''}" data-z="${r.zone}" colspan="${r.span}">${zoneName(r.zone)}</th>`;
  });
  h += '</tr><tr class="numrow"><th class="name">value</th>';
  EVENTS.forEach((e, n) => {
    h += `<th class="${n===i?'nowcol':''}" title="${(e.fn||e.what).replace(/"/g,'&quot;')}">` +
         `${e.by==='user'?'<span class="userflag">●</span>':n+1}</th>`;
  });
  h += '</tr></thead><tbody>';

  ALL_KEYS.forEach(key => {
    h += `<tr><th class="name">${key}</th>`;
    let cur = null;
    EVENTS.forEach((e, n) => {
      const set = e.sets && e.sets[key];
      if (set) cur = set;
      const c = [];
      if (n === i) c.push('nowcol');
      if (n > i) c.push('after');
      c.push('zt-' + e.zone);
      if (!cur) c.push('void');
      else if (set && set.was) c.push('change');
      else if (set) c.push('born');
      else c.push('hold');
      h += `<td class="${c.join(' ')}">${set ? `<span class="cv">${set.t}</span>` : cur ? '<span class="cv">·</span>' : ''}</td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  const s = stateAt(i);
  h += '<div class="values">';
  if (!Object.keys(s).length) h += '<span class="arr">nothing exists yet</span>';
  ALL_KEYS.forEach(k => {
    if (!s[k]) return;
    h += `<div class="row${s[k].at===i?' now':''}"><span class="lit k">${k}</span> ` +
      (s[k].was ? `<span class="ty was">${s[k].was}</span> <span class="arr">→</span> ` : '') +
      `<span class="ty">${s[k].t}</span> <span class="lit">${s[k].v}</span></div>`;
  });
  h += '</div>';

  const stage = document.getElementById('stage');
  stage.innerHTML = h;

  /* Centre the current column WITHOUT touching vertical scroll —
     scrollIntoView moves both axes and hides the first row under the
     sticky header. */
  const box = stage.querySelector('.grid'), col = stage.querySelector('th.nowcol');
  if (box && col) {
    const nameW = stage.querySelector('th.name').offsetWidth;
    box.scrollLeft = col.offsetLeft - nameW - (box.clientWidth - nameW) / 2 + col.offsetWidth / 2;
  }
}

/* ---------------- wiring ---------------- */
const slider=document.getElementById('slider'), readout=document.getElementById('readout'),
      noteEl=document.getElementById('note'), trigEl=document.getElementById('trigger');
slider.max = String(EVENTS.length - 1);
let i = 0;

function draw() {
  const e = EVENTS[i];
  trigEl.innerHTML =
    `<span class="by ${e.by}">${e.by==='user'?'you did this':'code ran'}</span>` +
    `<span class="what">${e.what}</span>` +
    (e.fn?`<span class="fn">${e.fn}</span>`:'') +
    (e.ret?`<span class="ret">${e.ret}</span>`:'') +
    (e.obs?'':'<span class="badge fut">not captured yet</span>') +
    (e.hop?'<span class="badge hop">type change</span>':'');
  render(i);
  slider.value = String(i);
  readout.textContent = `event ${i+1} of ${EVENTS.length} · ${zoneName(e.zone)}`;
  noteEl.textContent = e.note || '';
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === EVENTS.length - 1;
}
function go(n){ i = Math.max(0, Math.min(EVENTS.length-1, n)); draw(); }

slider.addEventListener('input', () => go(Number(slider.value)));
document.getElementById('prev').addEventListener('click', () => go(i-1));
document.getElementById('next').addEventListener('click', () => go(i+1));
addEventListener('keydown', ev => {
  const t = ev.target;
  if (t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if (ev.key==='ArrowLeft'){ go(i-1); ev.preventDefault(); }
  if (ev.key==='ArrowRight'){ go(i+1); ev.preventDefault(); }
});
draw();
</script>
</body>
</html>
